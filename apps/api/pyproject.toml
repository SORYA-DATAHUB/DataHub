[project]
name = "datahub-api"
version = "0.1.0"
description = "DataHub FastAPI modular monolith"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "argon2-cffi>=25.1.0",
  "boto3>=1.35,<2",
  "celery[redis]>=5.4,<6",
  "cryptography>=50.0.2",
  "email-validator>=2.3.0",
  "fastapi>=0.115,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic-settings>=2.6,<3",
  "pyotp>=2.10.0",
  "sqlalchemy>=2.0.36,<3",
  "structlog>=24.4,<26",
  "uvicorn[standard]>=0.32,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "mypy>=1.13,<2",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.8,<1",
  "time-machine>=3.6.0",
]

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datahub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.13"
strict = true
packages = ["datahub"]

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*", "celery", "redis"]
ignore_missing_imports = true
