  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: dh_session
      description: Opaque 256-bit session token (base64url). HttpOnly; Secure; SameSite=Lax; Path=/. Server stores SHA-256 only.
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
      description: Double-submit token; must equal the dh_csrf cookie and carry a valid HMAC bound to the session. Required on POST/PUT/PATCH/DELETE.
  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 10000
        default: 1
      description: 1-based page number.
    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
      description: Items per page (max 100).
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
        pattern: ^-?[a-z_]+(,-?[a-z_]+){0,2}$
        maxLength: 100
      description: Comma-separated fields, `-` prefix = descending (e.g. `-created_at`). Allowed fields per operation in `x-sortable-fields`;
        unknown field → 422. `id` is always appended as tie-breaker.
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]{8,128}$
      description: 'Client-generated unique key (UUID v4 recommended). Same key + same body within 24 h replays the stored response (`Idempotent-Replayed:
        true`).'
    IdempotencyKeyRequired:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]{8,128}$
      description: Required. Stored in payout_requests.client_idempotency_key (unique per user).
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
        maxLength: 32
      description: Resource `version` as returned in ETag (`"4"` or `4`). Mismatch → 412 precondition.failed.
    IfMatchRequired:
      name: If-Match
      in: header
      required: true
      schema:
        type: string
        maxLength: 32
      description: Current annotation version. Mismatch → 409 annotation.version_conflict with server copy.
    XRequestId:
      name: X-Request-ID
      in: header
      required: false
      schema:
        type: string
        maxLength: 64
        pattern: ^[A-Za-z0-9._-]{1,64}$
      description: Optional client correlation id; generated when absent; echoed in response and error envelope.
  headers:
    ETag:
      description: Quoted resource version, e.g. `"4"`.
      schema:
        type: string
    Location:
      description: URL of the created resource or redirect target.
      schema:
        type: string
    RetryAfter:
      description: Seconds until the limit resets.
      schema:
        type: integer
    XRequestId:
      description: Request id (also in error envelope).
      schema:
        type: string
    RateLimit:
      description: 'IETF draft RateLimit header: `limit=120, remaining=97, reset=31`.'
      schema:
        type: string
    SetCookie:
      description: dh_session and/or dh_csrf cookies.
      schema:
        type: string
    IdempotentReplayed:
      description: '`true` when the response is a stored replay.'
      schema:
        type: string
        enum:
        - 'true'
