components:
  schemas:
    RoleName:
      type: string
      enum:
      - contributor
      - annotator
      - reviewer
      - admin
      - super_admin
    PermissionCode:
      type: string
      enum:
      - profile.self
      - dataset.create
      - dataset.read.own
      - payout.request
      - message.self
      - annotation.work
      - dataset.review
      - annotation.review
      - dataset.read.any
      - user.read
      - user.manage
      - user.verify
      - annotation.manage
      - payout.approve
      - payout.record_payment
      - finance.read
      - finance.adjust
      - dataset.export
      - message.support
      - analytics.read
      - pricing.manage
      - role.manage
      - settings.manage
      - audit.read
    UserStatus:
      type: string
      enum:
      - pending_email
      - active
      - suspended
      - deactivated
      - anonymized
    UserVerificationStatus:
      type: string
      enum:
      - unverified
      - pending
      - approved
      - rejected
      - needs_info
    ContributorVerificationStatus:
      type: string
      enum:
      - pending
      - approved
      - rejected
      - needs_info
    UploadSessionStatus:
      type: string
      enum:
      - initiated
      - uploading
      - completed
      - aborted
      - expired
    FileProcessingStatus:
      type: string
      enum:
      - pending_upload
      - uploaded
      - processing
      - ready
      - failed
      - quarantined
    ScanStatus:
      type: string
      enum:
      - pending
      - clean
      - infected
      - error
      - skipped_container
    FileFailureCode:
      type: string
      enum:
      - type_mismatch
      - disallowed_type
      - nested_archive
      - corrupt
      - archive_limit_exceeded
      - unsafe_member_path
      - encrypted
      - scan_error
      - infected
      - size_mismatch
      - processing_error
      description: Machine-readable reason for processing_status failed/quarantined.
    DatasetStatus:
      type: string
      enum:
      - draft
      - submitted
      - in_review
      - approved
      - partially_approved
      - rejected
      - changes_requested
      - withdrawn
      - taken_down
    DataClass:
      type: string
      enum:
      - raw
      - labeled
    DatasetCategory:
      type: string
      enum:
      - books
      - news
      - government
      - academic
      - legal
      - religious
      - business
      - forms
      - handwriting
      - historical
      - web_text
      - other
    ReviewStatus:
      type: string
      enum:
      - in_progress
      - finalized
      - released
    ReviewDecision:
      type: string
      enum:
      - approve
      - partial
      - reject
      - request_changes
    FileReviewDecision:
      type: string
      enum:
      - accepted
      - rejected
    FileRejectReason:
      type: string
      enum:
      - duplicate
      - near_duplicate
      - low_quality
      - illegible
      - wrong_language
      - out_of_scope
      - personal_data
      - copyright_concern
      - corrupt
      - malware
      - metadata_mismatch
      - other
    DuplicateKind:
      type: string
      enum:
      - exact
      - near
    AnnotationTaskStatus:
      type: string
      enum:
      - unassigned
      - assigned
      - in_progress
      - submitted
      - in_review
      - approved
      - changes_requested
      - cancelled
    AnnotationProjectStatus:
      type: string
      enum:
      - active
      - closed
      description: Not a §9 state machine; projects are active until closed (terminal).
    AnnotationType:
      type: string
      enum:
      - transcription
      - text_correction
      - classification
      - metadata
      - page_label
      description: '`bbox` is reserved for v2 and rejected in v1.'
    TaskUnit:
      type: string
      enum:
      - file
      - page
    AnnotationReviewDecision:
      type: string
      enum:
      - approve
      - request_changes
    PayoutStatus:
      type: string
      enum:
      - requested
      - approved
      - paid
      - rejected
      - cancelled
      - failed
      - reversed
    PayoutMethodType:
      type: string
      enum:
      - bank_transfer
      - aba_pay
      - wise
      - paypal
      - other
    ExportStatus:
      type: string
      enum:
      - queued
      - running
      - completed
      - failed
      - expired
    ExportFormat:
      type: string
      enum:
      - zip_originals
      - jsonl_text
      description: zip_originals = original files + manifest.jsonl (+annotations); jsonl_text = extracted/annotated text only, packaged in ZIP.
    ConversationStatus:
      type: string
      enum:
      - open
      - awaiting_user
      - closed
    ConversationKind:
      type: string
      enum:
      - support
      - dataset
    AttachmentScanStatus:
      type: string
      enum:
      - pending
      - clean
      - infected
      - error
    JournalKind:
      type: string
      enum:
      - dataset_earning
      - annotation_reward
      - earning_release
      - payout_reserve
      - payout_release
      - payout_settle
      - adjustment_credit
      - adjustment_debit
      - payout_reversal
    LedgerBucket:
      type: string
      enum:
      - pending
      - available
      - reserved
      - paid
      - main
    AdjustmentDirection:
      type: string
      enum:
      - credit
      - debit
    AdjustmentReason:
      type: string
      enum:
      - correction
      - bonus
      - chargeback
      - duplicate_payment
      - takedown_clawback
      - other
    NotificationType:
      type: string
      enum:
      - email_verified
      - contributor_approved
      - contributor_rejected
      - verification_needs_info
      - dataset_received
      - dataset_processing_finished
      - dataset_approved
      - dataset_partially_approved
      - dataset_rejected
      - dataset_changes_requested
      - dataset_taken_down
      - earnings_credited
      - withdrawal_requested
      - withdrawal_approved
      - withdrawal_rejected
      - payment_recorded
      - payout_failed
      - payout_reversed
      - annotation_assigned
      - annotation_returned
      - annotation_approved
      - support_message
      - export_completed
      - security_alert
    SecurityEventType:
      type: string
      enum:
      - login_succeeded
      - login_failed
      - account_locked
      - logout
      - password_changed
      - password_reset_requested
      - password_reset_completed
      - email_verified
      - mfa_enabled
      - mfa_disabled
      - mfa_failed
      - mfa_recovery_code_used
      - session_revoked
      - csrf_rejected
      - permission_denied
      - rate_limited
      - payout_method_changed
    Language:
      type: string
      pattern: ^[a-z]{2,3}$
      description: ISO 639-1/639-3 code, e.g. `km`, `en`.
    ErrorEnvelope:
      type: object
      properties:
        error:
          type: object
          properties:
            code:
              type: string
              description: Stable dotted error code, see API_DOCUMENTATION.md §6.
            message:
              type: string
              description: Human-readable English message; never contains secrets.
            details:
              type:
              - object
              - 'null'
              description: Code-specific structured details (e.g. `fields` for validation).
            request_id:
              type: string
              description: Echo of X-Request-ID; quote it in support requests.
          required:
          - code
          - message
          - details
          - request_id
      required:
      - error
    ValidationFieldError:
      type: object
      properties:
        loc:
          type: array
          items:
            type:
            - string
            - integer
        msg:
          type: string
        type:
          type: string
      required:
      - loc
      - msg
      - type
    PaginationMeta:
      type: object
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
      required:
      - page
      - page_size
      - total
    OkStatus:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    CountResult:
      type: object
      properties:
        count:
          type: integer
          minimum: 0
      required:
      - count
    PresignedUrl:
      type: object
      properties:
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
        method:
          type: string
          enum:
          - GET
          - PUT
      required:
      - url
      - expires_at
      - method
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
        version:
          type: string
        time:
          type: string
          format: date-time
      required:
      - status
    Readiness:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
          - unavailable
        checks:
          type: object
          additionalProperties:
            type: string
            enum:
            - ok
            - fail
            - skipped
      required:
      - status
      - checks
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
          maxLength: 80
        status:
          $ref: '#/components/schemas/UserStatus'
        roles:
          type: array
          items:
            $ref: '#/components/schemas/RoleName'
        email_verified_at:
          type:
          - string
          - 'null'
          format: date-time
        verification_status:
          $ref: '#/components/schemas/UserVerificationStatus'
        onboarding_completed_at:
          type:
          - string
          - 'null'
          format: date-time
        mfa_enabled:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - email
      - display_name
      - status
      - roles
      - verification_status
      - mfa_enabled
      - created_at
    SessionState:
      type: object
      properties:
        id:
          type: string
          format: uuid
        mfa_verified:
          type: boolean
        mfa_required:
          type: boolean
        mfa_enrollment_required:
          type: boolean
        step_up_valid_until:
          type:
          - string
          - 'null'
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
        absolute_expires_at:
          type: string
          format: date-time
      required:
      - id
      - mfa_verified
      - mfa_required
      - mfa_enrollment_required
      - idle_expires_at
      - absolute_expires_at
    Me:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        permissions:
          type: array
          items:
            $ref: '#/components/schemas/PermissionCode'
        session:
          $ref: '#/components/schemas/SessionState'
        capabilities:
          type: object
          properties:
            can_upload:
              type: boolean
            can_withdraw:
              type: boolean
            can_be_assigned_annotation:
              type: boolean
            limited_reason:
              type:
              - string
              - 'null'
          required:
          - can_upload
          - can_withdraw
          - can_be_assigned_annotation
      required:
      - user
      - permissions
      - session
      - capabilities
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        last_seen_at:
          type: string
          format: date-time
        idle_expires_at:
          type: string
          format: date-time
        absolute_expires_at:
          type: string
          format: date-time
        ip:
          type: string
        user_agent:
          type: string
          maxLength: 512
        current:
          type: boolean
        mfa_verified_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - created_at
      - last_seen_at
      - idle_expires_at
      - absolute_expires_at
      - current
    SessionList:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
      required:
      - items
    CsrfToken:
      type: object
      properties:
        csrf_token:
          type: string
          description: Same value as the dh_csrf cookie; send as X-CSRF-Token.
      required:
      - csrf_token
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          format: email
        password:
          type: string
          minLength: 12
          maxLength: 128
          description: Min 12 chars, max 128; checked against common-password list.
        display_name:
          type: string
          minLength: 2
          maxLength: 80
        accept_terms:
          type: boolean
          const: true
        accept_privacy:
          type: boolean
          const: true
        terms_version:
          type: string
          maxLength: 32
      required:
      - email
      - password
      - display_name
      - accept_terms
      - accept_privacy
      - terms_version
      additionalProperties: false
    LoginRequest:
      type: object
      properties:
        email:
          type: string
          maxLength: 254
          format: email
        password:
          type: string
          minLength: 1
          maxLength: 128
      required:
      - email
      - password
      additionalProperties: false
    LoginResponse:
      type: object
      properties:
        mfa_required:
          type: boolean
        mfa_enrollment_required:
          type: boolean
        me:
          anyOf:
          - $ref: '#/components/schemas/Me'
          - type: 'null'
      required:
      - mfa_required
