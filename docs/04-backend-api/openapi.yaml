# DataHub OpenAPI 3.1 specification — Document control: v1.0, 2026-10-26, Baseline.
# Canonical source: docs/ENGINEERING_BASELINE.md §12. Human-readable companion: API_DOCUMENTATION.md.
openapi: 3.1.0
info:
  title: DataHub API
  version: 1.0.0
  summary: Data marketplace & annotation platform API (documentation baseline).
  description: 'Canonical contract per docs/ENGINEERING_BASELINE.md §12. All paths are under `/api/v1`; JSON (UTF-8) bodies; errors use `{"error":{"code","message","details","request_id"}}`.
    Money fields are integer micro-USD (`*_micros`), sizes are integer bytes (`*_bytes`), timestamps RFC 3339 UTC. Cookie session `dh_session`;
    unsafe methods require `X-CSRF-Token`. Human-readable conventions, error catalogue and WebSocket protocol: docs/04-backend-api/API_DOCUMENTATION.md.
    The implementation''s generated spec (FastAPI) is reconciled against this file in CI.'
  contact:
    name: DataHub engineering (SKAI Technology)
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
- url: /
  description: Same origin as the web app (Caddy in production; Next.js rewrite in development).
- url: http://localhost:8410
  description: Local development API container (direct).
tags:
- name: Health
  description: Probes and metrics.
- name: Auth
  description: Registration, login, MFA, sessions, password flows.
- name: Me
  description: Self-service profile, onboarding, payout methods, verification.
- name: Public
  description: Unauthenticated catalogue endpoints.
- name: Datasets
  description: Contributor dataset lifecycle.
- name: Files
  description: File metadata, previews, text, downloads.
- name: Uploads
  description: Resumable S3 multipart uploads.
- name: Review
  description: Dataset review workflow.
- name: Finance
  description: Contributor wallet, earnings, withdrawals.
- name: Admin finance
  description: Payout processing, adjustments, ledger, pricing.
- name: Annotation
  description: Projects, tasks, editor, annotation review.
- name: Messaging
  description: Conversations, messages, attachments, WebSocket.
- name: Notifications
  description: In-app notifications.
- name: Admin users
  description: User administration and verification.
- name: Admin datasets
  description: Dataset administration and takedown.
- name: Exports
  description: Background dataset exports.
- name: Admin
  description: Analytics, audit, settings, roles.
security:
- cookieAuth: []
paths:
  /api/v1/healthz:
    get:
      tags:
      - Health
      summary: Liveness probe
      operationId: get_healthz
      description: Process is up. No dependency checks. Never rate-limited, never authenticated.
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      security: []
      x-permission: public
      x-rate-limit: Not rate-limited (health probes; internal metrics).
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
              example: {status: ok, version: 1.0.0, time: '2026-10-26T08:30:00Z'}
        '500':
          description: 'Internal Server Error. Error codes: `internal_error`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: internal_error, message: Something went wrong. Quote the request id if you contact support., details: null,
                  request_id: req_01JBA7Q4M8}}
  /api/v1/readyz:
    get:
      tags:
      - Health
      summary: Readiness probe
      operationId: get_readyz
      description: 'Checks Postgres (SELECT 1 + Alembic head), Redis PING, S3 HeadBucket, clamd PING. Returns **503** with the same body shape
        when any required check fails (ClamAV failure ⇒ `degraded`: API serves, processing pauses).'
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      security: []
      x-permission: public
      x-rate-limit: Not rate-limited (health probes; internal metrics).
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example: {status: ok, checks: {postgres: ok, redis: ok, s3: ok, clamav: ok, migrations: ok}}
        '503':
          description: Service Unavailable — a required dependency failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
              example:
                status: unavailable
                checks:
                  postgres: ok
                  redis: fail
                  s3: ok
                  clamav: ok
                  migrations: ok
        '500':
          description: 'Internal Server Error. Error codes: `internal_error`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: internal_error, message: Something went wrong. Quote the request id if you contact support., details: null,
                  request_id: req_01JBA7Q4M8}}
  /api/v1/metrics:
    get:
      tags:
      - Health
      summary: Prometheus metrics (internal only)
      operationId: get_metrics
      description: Prometheus text exposition (`text/plain; version=0.0.4`). Caddy returns 404 for this path on the public listener; reachable
        only on the internal Docker network by the Prometheus scraper.
      security: []
      x-permission: internal
      x-rate-limit: Not rate-limited (health probes; internal metrics).
      responses:
        '200':
          description: OK
          content:
            text/plain:
              schema:
                type: string
              example: '# HELP http_requests_total Total requests

                # TYPE http_requests_total counter

                http_requests_total{route="/api/v1/datasets",method="GET",status="200"} 1027

                '
  /api/v1/auth/csrf:
    get:
      tags:
      - Auth
      summary: Issue CSRF token
      operationId: get_auth_csrf
      description: Sets/refreshes the `dh_csrf` cookie (not HttpOnly, Secure, SameSite=Lax, Path=/) and returns the same value. The token is `nonce.timestamp.HMAC-SHA256(secret,
        session_binding|nonce|timestamp)`; binding is the session id hash, or an anonymous pre-session id for unauthenticated forms. Call on app
        boot and after login/logout (both rotate it).
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      security: []
      x-permission: public
      x-rate-limit: 60 / min per IP.
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfToken'
              example: {csrf_token: c1a9b0f2e5d84f6c.1730000000.Q2x8hFz0Yw0m3vV5J2t3p5r1Xk6b4N8o9Lq7s0dE1aA}
        '429':
          description: 'Too Many Requests. Error codes: `rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: rate_limited, message: Too many requests. Try again later., details: null, request_id: req_01JBA7Q4M8}}
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '500':
          description: 'Internal Server Error. Error codes: `internal_error`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: internal_error, message: Something went wrong. Quote the request id if you contact support., details: null,
                  request_id: req_01JBA7Q4M8}}
  /api/v1/auth/register:
    post:
      tags:
      - Auth
      summary: Register a new account
      operationId: post_auth_register
      description: Creates a `pending_email` user with role `contributor` and sends a verification email (24 h link). **Enumeration-safe:** if
        the email already exists, the response is identical and the existing owner receives an 'account already exists' email instead. No session
        is created; the client shows 'check your inbox' and the user signs in normally (pending_email accounts may sign in with limited access).
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      security:
      - csrfToken: []
      x-permission: public
      x-rate-limit: 5 / h per IP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example: {email: sophea@example.com, password: correct horse battery staple, display_name: Sophea K., accept_terms: true, accept_privacy: true,
              terms_version: TOS-2026-10}
      responses:
        '202':
          description: Accepted
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Accepted'
              example: {status: accepted, message: 'If this email can be registered, we have sent a verification link.'}
        '400':
          description: 'Bad Request. Error codes: `request.malformed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: request.malformed, message: The request body is not valid JSON or has the wrong shape., details: null, request_id: req_01JBA7Q4M8}}
        '403':
          description: 'Forbidden. Error codes: `csrf.missing`, `csrf.invalid`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: csrf.missing, message: Security token missing. Reload the page., details: null, request_id: req_01JBA7Q4M8}}
        '413':
          description: 'Content Too Large. Error codes: `request.payload_too_large`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: request.payload_too_large, message: Request body too large., details: null, request_id: req_01JBA7Q4M8}}
        '415':
          description: 'Unsupported Media Type. Error codes: `request.unsupported_media_type`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: request.unsupported_media_type, message: Unsupported Content-Type., details: null, request_id: req_01JBA7Q4M8}}
        '422':
          description: 'Unprocessable Content. Error codes: `auth.password_policy`, `validation_error`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: auth.password_policy, message: Password does not meet the policy., details: null, request_id: req_01JBA7Q4M8}}
        '429':
          description: 'Too Many Requests. Error codes: `rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: rate_limited, message: Too many requests. Try again later., details: null, request_id: req_01JBA7Q4M8}}
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '500':
          description: 'Internal Server Error. Error codes: `internal_error`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: internal_error, message: Something went wrong. Quote the request id if you contact support., details: null,
                  request_id: req_01JBA7Q4M8}}
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Sign in with email and password
      operationId: post_auth_login
      description: 'Verifies credentials (constant-time; dummy Argon2 hash when the email is unknown). On success: revokes the pre-login session
        if any, creates a new session (rotation), sets `dh_session` (HttpOnly, Secure, SameSite=Lax, Path=/) and a fresh `dh_csrf`. If the user
        has MFA enabled, the session is created in *MFA-pending* state and the response is `{mfa_required: true, me: null}`; the client must call
        `POST /auth/mfa/verify`. Admin/super_admin without MFA get `{mfa_enrollment_required: true}` and may only call MFA setup/enable, me, csrf,
        logout.'
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      security:
      - csrfToken: []
      x-permission: public
      x-rate-limit: 5 / min per (IP + email) and 20 / min per IP; account lockout after 10 consecutive failures (15 min).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example: {email: sophea@example.com, password: correct horse battery staple}
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example: {mfa_required: false, mfa_enrollment_required: false, me: {user: {id: 01930b6e-8f2a-7c41-9a0e-5b7d2c1e4f01, email: sophea@example.com,
                    display_name: Sophea K., status: active, roles: [contributor], email_verified_at: '2026-10-20T03:00:00Z', verification_status: approved,
                    onboarding_completed_at: '2026-10-20T03:05:00Z', mfa_enabled: false, created_at: '2026-10-20T02:58:00Z', last_login_at: '2026-10-26T08:30:00Z'},
                  permissions: [profile.self, dataset.create, dataset.read.own, payout.request, message.self], session: {id: 01930b70-1111-7a00-8000-0000000000a1,
                    mfa_verified: false, mfa_required: false, mfa_enrollment_required: false, step_up_valid_until: null, idle_expires_at: '2026-11-02T08:30:00Z',
                    absolute_expires_at: '2026-11-25T08:30:00Z'}, capabilities: {can_upload: true, can_withdraw: true, can_be_assigned_annotation: false,
                    limited_reason: null}}}
        '400':
          description: 'Bad Request. Error codes: `request.malformed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: request.malformed, message: The request body is not valid JSON or has the wrong shape., details: null, request_id: req_01JBA7Q4M8}}
        '401':
          description: 'Unauthorized. Error codes: `auth.invalid_credentials`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: auth.invalid_credentials, message: Email or password is incorrect., details: null, request_id: req_01JBA7Q4M8}}
        '403':
          description: 'Forbidden. Error codes: `auth.account_suspended`, `auth.account_inactive`, `csrf.missing`, `csrf.invalid`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: auth.account_suspended, message: This account is suspended. Contact support., details: null, request_id: req_01JBA7Q4M8}}
        '413':
          description: 'Content Too Large. Error codes: `request.payload_too_large`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: request.payload_too_large, message: Request body too large., details: null, request_id: req_01JBA7Q4M8}}
        '415':
          description: 'Unsupported Media Type. Error codes: `request.unsupported_media_type`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: request.unsupported_media_type, message: Unsupported Content-Type., details: null, request_id: req_01JBA7Q4M8}}
        '422':
          description: 'Unprocessable Content. Error codes: `validation_error`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: validation_error, message: One or more fields are invalid., details: null, request_id: req_01JBA7Q4M8}}
        '429':
          description: 'Too Many Requests. Error codes: `auth.account_locked`, `rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: auth.account_locked, message: Too many failed sign-in attempts. Try again later., details: null, request_id: req_01JBA7Q4M8}}
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '500':
          description: 'Internal Server Error. Error codes: `internal_error`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: internal_error, message: Something went wrong. Quote the request id if you contact support., details: null,
                  request_id: req_01JBA7Q4M8}}
  /api/v1/auth/mfa/verify:
    post:
      tags:
      - Auth
      summary: Verify TOTP / recovery code (login second factor or step-up)
      operationId: post_auth_mfa_verify
      description: 'Completes login for MFA-pending sessions and doubles as **step-up**: on an already verified session it re-stamps `mfa_verified_at`,
        opening a 15-minute window for financial/privileged actions. TOTP: SHA-1, 6 digits, 30 s, ±1 step; the last accepted step is stored to
        prevent replay. A recovery code is single-use and triggers a security email. Session id is rotated on first verification.'
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      security:
      - cookieAuth: []
        csrfToken: []
      x-permission: authenticated
      x-rate-limit: 5 / min per session and 20 / h per user; 10 consecutive failures revoke the MFA-pending session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MfaVerifyRequest'
            example: {code: '492817'}
      responses:
        '200':
          description: OK
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              example: {user: {id: 01930b6e-8f2a-7c41-9a0e-5b7d2c1e4f01, email: sophea@example.com, display_name: Sophea K., status: active, roles: [
                    contributor], email_verified_at: '2026-10-20T03:00:00Z', verification_status: approved, onboarding_completed_at: '2026-10-20T03:05:00Z',
                  mfa_enabled: false, created_at: '2026-10-20T02:58:00Z', last_login_at: '2026-10-26T08:30:00Z'}, permissions: [profile.self,
                  dataset.create, dataset.read.own, payout.request, message.self], session: {id: 01930b70-1111-7a00-8000-0000000000a1, mfa_verified: true,
                  mfa_required: false, mfa_enrollment_required: false, step_up_valid_until: '2026-10-26T08:45:00Z', idle_expires_at: '2026-11-02T08:30:00Z',
                  absolute_expires_at: '2026-11-25T08:30:00Z'}, capabilities: {can_upload: true, can_withdraw: true, can_be_assigned_annotation: false,
                  limited_reason: null}}
        '400':
          description: 'Bad Request. Error codes: `request.malformed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: request.malformed, message: The request body is not valid JSON or has the wrong shape., details: null, request_id: req_01JBA7Q4M8}}
        '401':
          description: 'Unauthorized. Error codes: `auth.mfa_invalid_code`, `auth.not_authenticated`, `auth.session_expired`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: auth.mfa_invalid_code, message: The verification code is incorrect or expired., details: null, request_id: req_01JBA7Q4M8}}
        '403':
          description: 'Forbidden. Error codes: `csrf.missing`, `csrf.invalid`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: csrf.missing, message: Security token missing. Reload the page., details: null, request_id: req_01JBA7Q4M8}}
        '409':
          description: 'Conflict. Error codes: `auth.mfa_not_set_up`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: auth.mfa_not_set_up, message: Start two-factor setup first., details: null, request_id: req_01JBA7Q4M8}}
        '413':
          description: 'Content Too Large. Error codes: `request.payload_too_large`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: request.payload_too_large, message: Request body too large., details: null, request_id: req_01JBA7Q4M8}}
        '415':
          description: 'Unsupported Media Type. Error codes: `request.unsupported_media_type`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: request.unsupported_media_type, message: Unsupported Content-Type., details: null, request_id: req_01JBA7Q4M8}}
        '422':
          description: 'Unprocessable Content. Error codes: `validation_error`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: validation_error, message: One or more fields are invalid., details: null, request_id: req_01JBA7Q4M8}}
        '429':
          description: 'Too Many Requests. Error codes: `rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: rate_limited, message: Too many requests. Try again later., details: null, request_id: req_01JBA7Q4M8}}
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '500':
          description: 'Internal Server Error. Error codes: `internal_error`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: internal_error, message: Something went wrong. Quote the request id if you contact support., details: null,
                  request_id: req_01JBA7Q4M8}}
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Sign out current session
      operationId: post_auth_logout
      description: 'Revokes the current session row, clears `dh_session` and rotates `dh_csrf`. Idempotent: an already-invalid session still gets
        204 with cleared cookies.'
      parameters:
      - $ref: '#/components/parameters/XRequestId'
      security:
      - cookieAuth: []
        csrfToken: []
      x-permission: authenticated
      x-rate-limit: 120 / min per user.
      responses:
        '204':
          description: No Content
          headers:
            X-Request-ID:
              $ref: '#/components/headers/XRequestId'
            RateLimit:
              $ref: '#/components/headers/RateLimit'
            Set-Cookie:
              $ref: '#/components/headers/SetCookie'
        '401':
          description: 'Unauthorized. Error codes: `auth.not_authenticated`, `auth.session_expired`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: auth.not_authenticated, message: Sign in to continue., details: null, request_id: req_01JBA7Q4M8}}
        '403':
          description: 'Forbidden. Error codes: `csrf.missing`, `csrf.invalid`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: csrf.missing, message: Security token missing. Reload the page., details: null, request_id: req_01JBA7Q4M8}}
        '429':
          description: 'Too Many Requests. Error codes: `rate_limited`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: rate_limited, message: Too many requests. Try again later., details: null, request_id: req_01JBA7Q4M8}}
          headers:
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
        '500':
          description: 'Internal Server Error. Error codes: `internal_error`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example: {error: {code: internal_error, message: Something went wrong. Quote the request id if you contact support., details: null,
                  request_id: req_01JBA7Q4M8}}
  /api/v1/auth/verify-email:
    post:
      tags:
      - Auth
      summary: Confirm email with token
      operationId: post_auth_verify_email
      description: Token = 32 random bytes, base64url (43 chars). Looks up SHA-256(token) with purpose `email_verify`, checks expiry (24 h) and
        `used_at IS NULL`, then sets `email_verified_at`, status `pending_email → active`, marks the token used and invalidates other outstanding
